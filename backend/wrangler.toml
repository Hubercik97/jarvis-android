name = "jarvis-backend"
main = "entry.js"
compatibility_date = "2026-10-01"

# Bez logów żądań w panelu Cloudflare (treść rozmów nie trafia do logów).
[observability]
enabled = false

# Środowisko testowe: osobny Worker "jarvis-backend-test" z własnymi sekretami.
# Wdrażany tylko ręcznie workflowem "Jarvis — wdrożenie backendu (test)".
# Produkcyjny "jarvis-backend" (bez --env) nie jest wdrażany automatycznie.
[env.test]
name = "jarvis-backend-test"

[env.test.observability]
enabled = false

# Sekrety (ustawiane przez workflow z sekretów GitHub, nigdy w tym pliku):
#   OPENAI_API_KEY / ANTHROPIC_API_KEY — klucz wybranego modelu
#   APP_TOKEN          — token aplikacji (ten sam wpisujesz w aplikacji w Ustawieniach)
# Opcjonalnie AI_PROVIDER i MODEL; patrz docs/CLOUD_AI.md.

# Deploy only explicitly, after reviewing settings. Copy the database binding from
# wrangler.local.toml.example and replace its ID for a remote environment.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/projects", "/projects/*", "/health", "/stt", "/weather", "/developer/project", "/chat", "/tts", "/memory", "/memory/*", "/tasks", "/tasks/*", "/conversations", "/conversations/*"]
