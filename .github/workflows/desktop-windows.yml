name: Jarvis Desktop — Windows test build
on:
  push:
    paths: ['desktop/**', 'backend/**', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['desktop/**', 'backend/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
env:
  # CPU runtime is bundled; do not fetch unused CUDA/TensorRT libraries.
  ONNXRUNTIME_NODE_INSTALL: skip
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run check
        working-directory: backend
  windows:
    needs: backend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Electron window and IPC smoke test (local fixture API)
        run: node tests/electron-smoke.cjs
      - name: Offline Polish wake phrase and minimized conversation cycle
        run: node tests/wake-electron-smoke.cjs
      - name: Manual interruption and microphone recorder failure
        run: node tests/wake-interrupt-smoke.cjs
      - name: Microphone, cloud diagnostics and explicit local-control consent
        run: node tests/diagnostics-smoke.cjs
      - name: Realtime quiet wake benchmark (runner CPU, not N4000 certification)
        run: node tests/wake-benchmark.cjs > release/wake-benchmark.json
      - name: Build unsigned Windows x64 NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install EXE and test packaged application
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*Setup-x64.exe | Select-Object -First 1
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small" }
          $installDir = Join-Path $env:RUNNER_TEMP 'JarvisInstalled'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "NSIS installation failed: $($installed.ExitCode)" }
          $env:JARVIS_INSTALLED_EXE = Join-Path $installDir 'Jarvis Desktop.exe'
          node tests/installed-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw "Installed application smoke failed" }
          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw "Uninstaller missing" }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed" }
      - name: SHA256
        shell: pwsh
        run: |
          Get-ChildItem release/*Setup-x64.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Desktop-Windows-x64-test
          path: |
            desktop/release/*Setup-x64.exe
            desktop/release/*.sha256
            desktop/release/jarvis-desktop.png
            desktop/release/jarvis-installed.png
            desktop/release/jarvis-wake-complete.png
            desktop/release/jarvis-diagnostics.png
            desktop/release/wake-benchmark.json
          if-no-files-found: error
          retention-days: 14
